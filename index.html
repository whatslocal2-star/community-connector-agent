<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Connector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .page-layout {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 700px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-avatar {
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .header-info h2 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px;
      background: #74c69d;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent { align-self: flex-start; }

    .msg-avatar {
      width: 28px; height: 28px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.agent .bubble {
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: #2d6a4f;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: #9ca3af;
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
    }
    .input-wrap {
      flex: 1;
      background: #f3f4f6;
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
    }
    textarea {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      resize: none;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      max-height: 120px;
      line-height: 1.4;
    }
    textarea::placeholder { color: #9ca3af; }

    .send-btn {
      width: 42px; height: 42px;
      background: #2d6a4f;
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:hover { background: #1b4332; }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { background: #d1d5db; cursor: not-allowed; transform: none; }

    .send-icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Welcome banner */
    .welcome {
      text-align: center;
      padding: 8px 12px 4px;
      color: #6b7280;
      font-size: 12px;
    }
    .welcome span {
      background: #f3f4f6;
      padding: 4px 12px;
      border-radius: 12px;
    }

    @media (max-height: 700px) {
      .chat-wrapper { border-radius: 0; max-height: 100vh; }
    }

    /* ── Dev Toolbar ── */
    .dev-toolbar {
      display: none;
      width: 210px;
      height: min(700px, 100vh);
      background: #fff;
      border-radius: 16px;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      flex-shrink: 0;
    }

    @media (min-width: 860px) {
      .dev-toolbar { display: flex; }
    }

    .dev-header {
      background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dev-title {
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .dev-badge {
      font-size: 10px;
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.15);
      padding: 2px 7px;
      border-radius: 4px;
    }

    .dev-new-btn {
      margin: 12px 12px 6px;
      padding: 9px 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      color: #2d6a4f;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
      width: calc(100% - 24px);
    }
    .dev-new-btn:hover {
      background: #dcfce7;
      border-color: #86efac;
    }

    .dev-persona-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .dev-persona-list::-webkit-scrollbar { width: 3px; }
    .dev-persona-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .dev-persona-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 10px 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .dev-persona-card:hover {
      background: #f3f4f6;
      border-color: #d1d5db;
    }
    .dev-persona-card.active {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .dev-persona-name {
      font-size: 13px;
      color: #111827;
      font-weight: 600;
      outline: none;
      border-radius: 4px;
      margin-bottom: 3px;
      cursor: text;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 18px;
    }
    .dev-persona-name:focus {
      background: #e5e7eb;
      padding: 1px 5px;
      white-space: normal;
      overflow: visible;
    }

    .dev-persona-uid {
      font-size: 10px;
      color: #9ca3af;
      font-family: "SF Mono", "Fira Code", monospace;
      margin-bottom: 7px;
      cursor: default;
      user-select: all;
    }

    .dev-persona-actions {
      display: flex;
      gap: 5px;
    }

    .dev-switch-btn {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      font-family: inherit;
      background: #d1fae5;
      border: 1px solid #6ee7b7;
      border-radius: 5px;
      color: #065f46;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dev-switch-btn:hover:not(:disabled) {
      background: #a7f3d0;
    }
    .dev-switch-btn:disabled {
      opacity: 0.5;
      cursor: default;
      background: #d1fae5;
    }

    .dev-refresh-btn {
      padding: 4px 9px;
      font-size: 13px;
      font-family: inherit;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 5px;
      color: #dc2626;
      cursor: pointer;
      transition: background 0.15s;
      line-height: 1;
    }
    .dev-refresh-btn:hover {
      background: #fee2e2;
    }

    .dev-footer {
      padding: 9px 14px;
      border-top: 1px solid #e5e7eb;
      font-size: 10px;
      color: #9ca3af;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
<div class="page-layout">

  <!-- Dev toolbar (desktop only, left side) -->
  <div class="dev-toolbar" id="devToolbar">
    <div class="dev-header">
      <span class="dev-title">DEV</span>
      <span class="dev-badge">personas</span>
    </div>
    <button class="dev-new-btn" id="devNewBtn">+ New Persona</button>
    <div class="dev-persona-list" id="devPersonaList"></div>
    <div class="dev-footer">click name to rename</div>
  </div>

  <!-- Chat -->
  <div class="chat-wrapper">
    <div class="header">
      <div class="header-avatar">🌿</div>
      <div class="header-info">
        <h2>Community Connector</h2>
        <p><span class="status-dot"></span>Vendors · Shoppers · Artists · Organizers · Influencers</p>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome"><span>Say hi to get started 👋</span></div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea
          id="input"
          rows="1"
          placeholder="Type a message..."
          autocomplete="off"
          spellcheck="true"
        ></textarea>
      </div>
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg class="send-icon" viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>


</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("sendBtn");

  let history = [];

  // ── Persona store ──────────────────────────────────────────────
  const PERSONAS_KEY      = "cc_personas";
  const ACTIVE_PERSONA_KEY = "cc_active_persona";

  function loadPersonas() {
    try { return JSON.parse(localStorage.getItem(PERSONAS_KEY) || "[]"); }
    catch { return []; }
  }

  function savePersonas(personas) {
    localStorage.setItem(PERSONAS_KEY, JSON.stringify(personas));
  }

  function getActivePersonaId() {
    return localStorage.getItem(ACTIVE_PERSONA_KEY);
  }

  function setActivePersonaId(id) {
    localStorage.setItem(ACTIVE_PERSONA_KEY, id);
  }

  function getActivePersona() {
    const personas = loadPersonas();
    const id = getActivePersonaId();
    return personas.find(p => p.id === id) || personas[0] || null;
  }

  function initPersonas() {
    let personas = loadPersonas();
    if (personas.length === 0) {
      const uid = localStorage.getItem("cc_session_id") || crypto.randomUUID();
      const first = { id: crypto.randomUUID(), name: "User 1", uid, history: [] };
      personas = [first];
      savePersonas(personas);
      setActivePersonaId(first.id);
    }
    const activeId = getActivePersonaId();
    if (!personas.find(p => p.id === activeId)) {
      setActivePersonaId(personas[0].id);
    }
  }

  function createPersona() {
    const personas = loadPersonas();
    const p = {
      id: crypto.randomUUID(),
      name: `User ${personas.length + 1}`,
      uid: crypto.randomUUID(),
      history: [],
    };
    personas.push(p);
    savePersonas(personas);
    return p;
  }

  function saveCurrentHistory() {
    const p = getActivePersona();
    if (!p) return;
    const personas = loadPersonas();
    const idx = personas.findIndex(x => x.id === p.id);
    if (idx >= 0) {
      personas[idx].history = history;
      savePersonas(personas);
    }
  }

  function switchToPersona(personaId) {
    saveCurrentHistory();
    setActivePersonaId(personaId);
    const personas = loadPersonas();
    const p = personas.find(x => x.id === personaId);
    if (!p) return;
    localStorage.setItem("cc_session_id", p.uid);
    history = p.history ? [...p.history] : [];
    renderChat();
    renderPersonaList();
  }

  function refreshPersonaUid(personaId) {
    const personas = loadPersonas();
    const idx = personas.findIndex(p => p.id === personaId);
    if (idx < 0) return;
    personas[idx].uid = crypto.randomUUID();
    personas[idx].history = [];
    savePersonas(personas);
    if (getActivePersonaId() === personaId) {
      localStorage.setItem("cc_session_id", personas[idx].uid);
      history = [];
      renderChat();
    }
    renderPersonaList();
  }

  // ── Chat rendering ─────────────────────────────────────────────
  function renderChat() {
    messagesEl.innerHTML = "";
    if (history.length === 0) {
      messagesEl.innerHTML = '<div class="welcome"><span>Say hi to get started 👋</span></div>';
    } else {
      for (const msg of history) {
        addMessage(msg.role === "assistant" ? "agent" : "user", msg.content);
      }
    }
  }

  function now() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function addMessage(role, text) {
    const isUser = role === "user";
    const wrapper = document.createElement("div");
    wrapper.className = `msg ${role}`;

    if (!isUser) {
      const avatar = document.createElement("div");
      avatar.className = "msg-avatar";
      avatar.textContent = "🌿";
      wrapper.appendChild(avatar);
    }

    const inner = document.createElement("div");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    inner.appendChild(bubble);

    const time = document.createElement("div");
    time.className = "msg-time";
    time.textContent = now();
    inner.appendChild(time);

    wrapper.appendChild(inner);
    messagesEl.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
  }

  function showTyping() {
    const wrapper = document.createElement("div");
    wrapper.className = "msg agent typing";
    wrapper.id = "typing";

    const avatar = document.createElement("div");
    avatar.className = "msg-avatar";
    avatar.textContent = "🌿";
    wrapper.appendChild(avatar);

    const inner = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      bubble.appendChild(dot);
    }
    inner.appendChild(bubble);
    wrapper.appendChild(inner);

    messagesEl.appendChild(wrapper);
    scrollToBottom();
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: "smooth" });
  }

  function setLoading(loading) {
    sendBtn.disabled = loading;
    inputEl.disabled = loading;
  }

  function getSessionId() {
    const p = getActivePersona();
    if (p) return p.uid;
    let id = localStorage.getItem("cc_session_id");
    if (!id) { id = crypto.randomUUID(); localStorage.setItem("cc_session_id", id); }
    return id;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    const welcome = messagesEl.querySelector(".welcome");
    if (welcome) welcome.remove();

    inputEl.value = "";
    inputEl.style.height = "auto";

    addMessage("user", text);
    history.push({ role: "user", content: text });

    setLoading(true);
    showTyping();

    try {
      const res = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, sessionId: getSessionId() }),
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok || data.error) {
        addMessage("agent", data.error || "Something went wrong. Please try again.");
        return;
      }

      addMessage("agent", data.reply);
      history.push({ role: "assistant", content: data.reply });
      saveCurrentHistory();
    } catch (err) {
      removeTyping();
      addMessage("agent", "Connection error. Please check your network and try again.");
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });

  // ── Dev toolbar rendering ──────────────────────────────────────
  function renderPersonaList() {
    const listEl = document.getElementById("devPersonaList");
    if (!listEl) return;

    const personas = loadPersonas();
    const activeId = getActivePersonaId();
    listEl.innerHTML = "";

    for (const persona of personas) {
      const isActive = persona.id === activeId;

      const card = document.createElement("div");
      card.className = "dev-persona-card" + (isActive ? " active" : "");

      // Editable name
      const nameEl = document.createElement("div");
      nameEl.className = "dev-persona-name";
      nameEl.contentEditable = "true";
      nameEl.spellcheck = false;
      nameEl.textContent = persona.name;
      nameEl.addEventListener("blur", () => {
        const updated = loadPersonas();
        const i = updated.findIndex(p => p.id === persona.id);
        if (i >= 0) {
          updated[i].name = nameEl.textContent.trim() || persona.name;
          savePersonas(updated);
        }
      });
      nameEl.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); nameEl.blur(); }
      });
      // Prevent card click from firing when editing name
      nameEl.addEventListener("click", e => e.stopPropagation());
      card.appendChild(nameEl);

      // UID display
      const uidEl = document.createElement("div");
      uidEl.className = "dev-persona-uid";
      uidEl.textContent = persona.uid.slice(0, 8) + "…";
      uidEl.title = persona.uid;
      card.appendChild(uidEl);

      // Action buttons
      const actions = document.createElement("div");
      actions.className = "dev-persona-actions";

      const switchBtn = document.createElement("button");
      switchBtn.className = "dev-switch-btn";
      switchBtn.textContent = isActive ? "Active" : "Switch";
      switchBtn.disabled = isActive;
      switchBtn.addEventListener("click", e => {
        e.stopPropagation();
        if (!isActive) switchToPersona(persona.id);
      });
      actions.appendChild(switchBtn);

      const refreshBtn = document.createElement("button");
      refreshBtn.className = "dev-refresh-btn";
      refreshBtn.textContent = "↻";
      refreshBtn.title = "New UID — clears chat history";
      refreshBtn.addEventListener("click", e => {
        e.stopPropagation();
        if (confirm(`Reset UID for "${persona.name}"?\nThis clears their chat history.`)) {
          refreshPersonaUid(persona.id);
        }
      });
      actions.appendChild(refreshBtn);

      card.appendChild(actions);

      // Click card body to switch
      card.addEventListener("click", () => {
        if (!isActive) switchToPersona(persona.id);
      });

      listEl.appendChild(card);
    }
  }

  document.getElementById("devNewBtn").addEventListener("click", () => {
    const p = createPersona();
    switchToPersona(p.id);
    // Focus the new persona's name for immediate renaming
    setTimeout(() => {
      const nameEl = document.querySelector(".dev-persona-card.active .dev-persona-name");
      if (nameEl) { nameEl.focus(); document.execCommand("selectAll"); }
    }, 60);
  });

  // ── Boot ───────────────────────────────────────────────────────
  initPersonas();
  const bootPersona = getActivePersona();
  if (bootPersona) {
    history = bootPersona.history ? [...bootPersona.history] : [];
    localStorage.setItem("cc_session_id", bootPersona.uid);
  }
  renderChat();
  renderPersonaList();
</script>
</body>
</html>
