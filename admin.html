<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Connector — Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #111827;
      min-height: 100vh;
    }

    /* ── Login ── */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      text-align: center;
    }
    .login-card h1 { font-size: 20px; margin-bottom: 6px; }
    .login-card p  { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
    .login-card input {
      width: 100%; padding: 10px 14px;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 14px; outline: none; margin-bottom: 12px;
    }
    .login-card input:focus { border-color: #2d6a4f; }
    .login-card button {
      width: 100%; padding: 10px;
      background: #2d6a4f; color: #fff;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .login-card button:hover { background: #1b4332; }
    .login-error { color: #dc2626; font-size: 13px; margin-top: 10px; }

    /* ── App shell ── */
    .app { display: none; flex-direction: column; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .refresh-btn {
      background: rgba(255,255,255,0.15); border: none; border-radius: 8px;
      color: #fff; padding: 6px 14px; font-size: 13px; cursor: pointer;
    }
    .refresh-btn:hover { background: rgba(255,255,255,0.25); }
    .logout-btn {
      background: none; border: none; color: rgba(255,255,255,0.7);
      font-size: 13px; cursor: pointer;
    }
    .logout-btn:hover { color: #fff; }

    /* ── Stats bar ── */
    .stats {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      overflow-x: auto;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px 20px;
      min-width: 120px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #111827; line-height: 1; }
    .stat-card .label { font-size: 11px; color: #6b7280; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Filters ── */
    .filters {
      padding: 0 24px 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1.5px solid #d1d5db;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-btn.active {
      background: #2d6a4f;
      border-color: #2d6a4f;
      color: #fff;
    }
    .filter-btn .count {
      background: rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 600;
    }
    .filter-btn.active .count { background: rgba(255,255,255,0.25); }

    /* ── Search ── */
    .search-bar {
      padding: 0 24px 16px;
    }
    .search-bar input {
      width: 100%; max-width: 400px;
      padding: 9px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .search-bar input:focus { border-color: #2d6a4f; }

    /* ── Table ── */
    .table-wrap {
      flex: 1;
      padding: 0 24px 24px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      font-size: 13px;
    }
    th {
      background: #f9fafb;
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid #f3f4f6;
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fafb; cursor: pointer; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: capitalize;
      white-space: nowrap;
    }
    .badge-vendor     { background: #d1fae5; color: #065f46; }
    .badge-shopper    { background: #dbeafe; color: #1e40af; }
    .badge-artist     { background: #ede9fe; color: #5b21b6; }
    .badge-organizer  { background: #fef3c7; color: #92400e; }
    .badge-influencer { background: #fce7f3; color: #9d174d; }
    .badge-unknown    { background: #f3f4f6; color: #6b7280; }

    .source-tag {
      font-size: 11px;
      color: #9ca3af;
      background: #f3f4f6;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .key-info { color: #374151; }
    .key-info .dim { color: #9ca3af; font-size: 12px; }

    .time { color: #9ca3af; font-size: 12px; white-space: nowrap; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 620px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      position: sticky; top: 0;
      background: #fff;
      z-index: 1;
    }
    .modal-header-left { display: flex; flex-direction: column; gap: 6px; }
    .modal-header-left h2 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .modal-id {
      font-size: 11px; color: #9ca3af;
      font-family: monospace;
      display: flex; align-items: center; gap: 6px;
    }
    .copy-btn {
      background: #f3f4f6; border: none; border-radius: 4px;
      padding: 2px 8px; font-size: 10px; cursor: pointer; color: #6b7280;
    }
    .copy-btn:hover { background: #e5e7eb; }
    .modal-close {
      background: none; border: none;
      font-size: 22px; cursor: pointer; color: #9ca3af;
      line-height: 1; flex-shrink: 0; margin-top: 2px;
    }
    .modal-close:hover { color: #111; }
    .modal-body { padding: 0 24px 24px; }

    .profile-section { padding-top: 20px; }
    .profile-section + .profile-section { border-top: 1px solid #f3f4f6; padding-top: 16px; margin-top: 4px; }
    .section-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
      color: #9ca3af; font-weight: 600; margin-bottom: 12px;
    }

    .field-row {
      display: flex; align-items: baseline;
      gap: 12px; margin-bottom: 10px;
    }
    .field-label {
      font-size: 12px; color: #6b7280;
      min-width: 140px; flex-shrink: 0;
    }
    .field-value { font-size: 13px; color: #111827; word-break: break-word; flex: 1; }
    .field-value a { color: #2d6a4f; text-decoration: none; }
    .field-value a:hover { text-decoration: underline; }
    .field-value.muted { color: #9ca3af; }

    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag {
      background: #f3f4f6; border-radius: 8px;
      padding: 3px 10px; font-size: 12px; color: #374151;
    }
    .bool-yes { color: #059669; font-weight: 500; }
    .bool-no  { color: #9ca3af; }

    .raw-toggle {
      margin-top: 16px; padding-top: 16px;
      border-top: 1px solid #f3f4f6;
    }
    .raw-toggle summary {
      font-size: 11px; color: #9ca3af; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.5px;
      list-style: none;
    }
    .raw-toggle summary:hover { color: #6b7280; }
    .raw-json {
      margin-top: 10px;
      background: #f9fafb; border-radius: 8px;
      padding: 12px; font-family: monospace;
      font-size: 11px; color: #374151;
      overflow-x: auto; white-space: pre;
    }

    .loading {
      text-align: center; padding: 60px;
      color: #9ca3af; font-size: 14px;
    }

    /* ── Matches ── */
    .find-matches-btn {
      background: #2d6a4f; color: #fff; border: none; border-radius: 8px;
      padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer;
      margin-top: 6px; align-self: flex-start;
    }
    .find-matches-btn:hover { background: #1b4332; }
    .find-matches-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .matches-list { display: flex; flex-direction: column; gap: 8px; }
    .match-card {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 10px;
      background: #f9fafb; cursor: pointer;
      transition: background 0.15s;
      border: 1px solid #f3f4f6;
    }
    .match-card:hover { background: #f0fdf4; border-color: #bbf7d0; }
    .match-score {
      font-size: 13px; font-weight: 700; color: #2d6a4f;
      min-width: 40px; text-align: center; flex-shrink: 0;
    }
    .match-info { flex: 1; min-width: 0; }
    .match-name { margin-bottom: 3px; }
    .match-summary { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .match-location { font-size: 11px; color: #9ca3af; margin-top: 2px; }

    /* ── Conversation ── */
    .tab-bar {
      display: flex; gap: 0;
      border-bottom: 1px solid #e5e7eb;
      margin: 0 -24px; padding: 0 24px;
      margin-top: 16px;
    }
    .tab-btn {
      padding: 8px 16px; font-size: 13px; font-weight: 500;
      background: none; border: none; cursor: pointer;
      color: #6b7280; border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab-btn.active { color: #2d6a4f; border-bottom-color: #2d6a4f; }
    .tab-btn:hover { color: #111; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .convo-wrap {
      display: flex; flex-direction: column; gap: 10px;
      padding: 16px 0;
    }
    .bubble-row { display: flex; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.assistant { justify-content: flex-start; }
    .bubble {
      max-width: 75%; padding: 9px 14px;
      border-radius: 16px; font-size: 13px; line-height: 1.5;
      word-break: break-word;
    }
    .bubble-row.user .bubble {
      background: #2d6a4f; color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-row.assistant .bubble {
      background: #f3f4f6; color: #111827;
      border-bottom-left-radius: 4px;
    }
    .bubble-role {
      font-size: 10px; color: #9ca3af;
      margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .bubble-row.user .bubble-role { text-align: right; }
    .convo-empty { color: #9ca3af; font-size: 13px; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>

<!-- Login -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div style="font-size:32px;margin-bottom:12px">🌿</div>
    <h1>Admin Dashboard</h1>
    <p>Community Connector</p>
    <input type="password" id="tokenInput" placeholder="Enter admin token" />
    <button onclick="login()">Sign in</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- App -->
<div class="app" id="app">
  <header>
    <h1>🌿 Community Connector — Admin</h1>
    <div class="header-right">
      <button class="refresh-btn" onclick="loadMembers()">↻ Refresh</button>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters"></div>

  <div class="convener" id="convener" style="margin:0 24px 16px;padding:16px;border:1px solid #e5e7eb;border-radius:12px;background:#fafafa;">
    <div style="font-weight:600;margin-bottom:8px;">🤝 Convener — find collaborators for an objective</div>
    <textarea id="convenerObjective" rows="2" placeholder="e.g. an event series about places of the world — need artists, a venue, and food vendors" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:8px;font:inherit;box-sizing:border-box;"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap;">
      <input id="convenerAnchor" placeholder="Anchor member ID (optional — log intros from this member)" style="flex:1;min-width:240px;padding:8px;border:1px solid #d1d5db;border-radius:8px;font:inherit;" />
      <button class="refresh-btn" onclick="convenerSearch()">Find collaborators</button>
    </div>
    <div id="convenerResults" style="margin-top:12px;"></div>
  </div>

  <div class="search-bar">
    <input type="search" id="searchInput" placeholder="Search by name, city, discipline, niche, cause…" oninput="render()" />
  </div>

  <div class="table-wrap">
    <div class="loading" id="loading">Loading members…</div>
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>Type</th>
          <th>Name</th>
          <th>Key Info</th>
          <th>Location</th>
          <th>Source</th>
          <th>Last Active</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No members match your filter.</div>
  </div>
</div>

<!-- Profile Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-header-left">
        <h2 id="modalTitle">Member Profile</h2>
        <div class="modal-id" id="modalId"></div>
        <button class="find-matches-btn" id="findMatchesBtn" onclick="findMatches()">Find Matches</button>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('profile')">Profile</button>
        <button class="tab-btn" onclick="switchTab('conversation')" id="convoTabBtn">Conversation</button>
      </div>
      <div class="tab-panel active" id="tabProfile"></div>
      <div class="tab-panel" id="tabConversation"></div>
    </div>
    <div id="matchesPanel" style="padding: 0 24px 24px;"></div>
  </div>
</div>

<script>
  let allMembers = [];
  let currentModalId = null;
  let activeFilter = "all";

  // ── Auth ──
  function login() {
    const token = document.getElementById("tokenInput").value.trim();
    if (!token) return;
    sessionStorage.setItem("admin_token", token);
    init();
  }

  function logout() {
    sessionStorage.removeItem("admin_token");
    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("tokenInput").value = "";
  }

  document.getElementById("tokenInput").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
  });

  // ── Init ──
  function init() {
    const token = sessionStorage.getItem("admin_token");
    if (!token) return;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    loadMembers();
  }

  async function loadMembers() {
    const token = sessionStorage.getItem("admin_token");
    document.getElementById("loading").style.display = "block";
    document.getElementById("table").style.display = "none";
    document.getElementById("empty").style.display = "none";

    try {
      const res = await fetch("/.netlify/functions/admin", {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401) {
        document.getElementById("loginError").textContent = "Invalid token.";
        logout();
        return;
      }

      const { members } = await res.json();
      allMembers = members || [];
      buildStats();
      buildFilters();
      render();
    } catch (err) {
      document.getElementById("loading").textContent = "Failed to load. Check your connection.";
    }
  }

  // ── Stats ──
  const TYPES = ["vendor", "shopper", "artist", "organizer", "influencer"];
  const TYPE_LABELS = { vendor: "Vendors", shopper: "Shoppers", artist: "Artists", organizer: "Organizers", influencer: "Influencers" };

  // Normalize AI output → canonical type. AI may capitalise or use "community organizer".
  function normalizeType(raw) {
    if (!raw) return "unknown";
    const s = raw.toLowerCase().trim();
    if (s.includes("organizer") || s.includes("organiser")) return "organizer";
    if (s.includes("vendor") || s.includes("business")) return "vendor";
    if (s.includes("shopper")) return "shopper";
    if (s.includes("artist")) return "artist";
    if (s.includes("influencer")) return "influencer";
    return s;
  }

  function getMemberType(m) {
    return normalizeType(m.profile?.memberType);
  }

  function getMemberSource(m) {
    return m.source || m.meta?.source || "web";
  }

  function countByType(type) {
    return allMembers.filter(m => getMemberType(m) === type).length;
  }

  function buildStats() {
    const el = document.getElementById("stats");
    const total = allMembers.length;
    let html = `<div class="stat-card"><div class="num">${total}</div><div class="label">Total Members</div></div>`;
    for (const t of TYPES) {
      const n = countByType(t);
      if (n > 0) html += `<div class="stat-card"><div class="num">${n}</div><div class="label">${TYPE_LABELS[t]}</div></div>`;
    }
    const sms = allMembers.filter(m => getMemberSource(m) === "sms").length;
    const web = allMembers.filter(m => getMemberSource(m) === "web").length;
    html += `<div class="stat-card"><div class="num">${sms}</div><div class="label">Via SMS</div></div>`;
    html += `<div class="stat-card"><div class="num">${web}</div><div class="label">Via Web</div></div>`;
    el.innerHTML = html;
  }

  function buildFilters() {
    const el = document.getElementById("filters");
    const allCount = allMembers.length;
    let html = `<button class="filter-btn ${activeFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All <span class="count">${allCount}</span></button>`;
    for (const t of TYPES) {
      const n = countByType(t);
      html += `<button class="filter-btn ${activeFilter === t ? 'active' : ''}" onclick="setFilter('${t}')">${TYPE_LABELS[t]} <span class="count">${n}</span></button>`;
    }
    el.innerHTML = html;
  }

  function setFilter(type) {
    activeFilter = type;
    buildFilters();
    render();
  }

  // ── Render table ──
  function render() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    let members = activeFilter === "all" ? allMembers : allMembers.filter(m => getMemberType(m) === activeFilter);

    if (query) {
      members = members.filter(m => JSON.stringify(m.profile || {}).toLowerCase().includes(query));
    }

    const tbody = document.getElementById("tbody");
    const loading = document.getElementById("loading");
    const table = document.getElementById("table");
    const empty = document.getElementById("empty");

    loading.style.display = "none";

    if (members.length === 0) {
      table.style.display = "none";
      empty.style.display = "block";
      return;
    }

    table.style.display = "table";
    empty.style.display = "none";

    tbody.innerHTML = members.map(m => {
      const p = m.profile || {};
      const type = getMemberType(m);
      const keyInfo = getKeyInfo(type, p);
      const location = p.city || p.neighborhood || p.location || "—";
      const source = getMemberSource(m);
      const lastActive = m.lastActiveAt ? timeAgo(m.lastActiveAt._seconds * 1000) : "—";
      const id = m.id;

      const name = p.name || "—";
      return `<tr onclick="openModal('${escapeId(id)}')">
        <td><span class="badge badge-${type}">${type}</span></td>
        <td class="key-info">${name}</td>
        <td class="key-info">${keyInfo}</td>
        <td>${location}</td>
        <td><span class="source-tag">${source}</span></td>
        <td class="time">${lastActive}</td>
      </tr>`;
    }).join("");
  }

  function joinOrStr(val) {
    if (!val) return "";
    return Array.isArray(val) ? val.join(", ") : String(val);
  }

  function getKeyInfo(type, p) {
    switch (type) {
      case "vendor":     return p.approvedBlurb || p.businessDescription || p.businessLink || `<span class="dim">No details yet</span>`;
      case "shopper":    return joinOrStr(p.interests) || `<span class="dim">No interests yet</span>`;
      case "artist":     return [p.discipline, joinOrStr(p.venueTypes)].filter(Boolean).join(" · ") || `<span class="dim">No details yet</span>`;
      case "organizer":  return p.cause || `<span class="dim">No cause listed yet</span>`;
      case "influencer": return [p.niche, joinOrStr(p.platforms)].filter(Boolean).join(" · ") || `<span class="dim">No details yet</span>`;
      default:           return `<span class="dim">Onboarding in progress</span>`;
    }
  }

  // ── Modal ──
  const memberMap = {};

  function escapeId(id) {
    return id.replace(/['"]/g, "");
  }

  function openModal(id) {
    const m = allMembers.find(x => x.id === id);
    if (!m) return;
    const p = m.profile || {};
    const type = getMemberType(m);
    currentModalId = id;

    const displayName = p.name || (getMemberSource(m) === "sms" ? "SMS member" : "Web member");
    document.getElementById("modalTitle").innerHTML =
      `<span class="badge badge-${type}">${type}</span> <span style="color:#6b7280;font-weight:400">${displayName}</span>`;
    document.getElementById("modalId").innerHTML =
      `${m.id} <button class="copy-btn" onclick="copyId('${escapeId(m.id)}')">copy</button>`;
    document.getElementById("tabProfile").innerHTML = buildProfileHtml(type, p, m);
    document.getElementById("tabConversation").innerHTML = `<div class="convo-empty">Click to load conversation…</div>`;
    document.getElementById("matchesPanel").innerHTML = "";
    const btn = document.getElementById("findMatchesBtn");
    btn.disabled = false;
    btn.textContent = "Find Matches";
    switchTab("profile");
    document.getElementById("modalOverlay").classList.add("open");
  }

  function copyId(id) {
    navigator.clipboard.writeText(id).catch(() => {});
  }

  // All known profile keys — used to detect extras
  const KNOWN_PROFILE_KEYS = new Set([
    "name","memberType","businessLink","businessDescription","approvedBlurb","shareTypes",
    "openToBusinessCollabs","eventPlatforms","interests","neighborhood","location",
    "personalNote","stayConnectedPreference","connectionPreference","discipline",
    "venueTypes","portfolioLink","city","travelRadius","openToArtistCollabs",
    "cause","impactGoals","connectWith","orgLink","openToOtherCommunities",
    "niche","platforms","audienceSize","partnershipTypes","profileLink","onboardingComplete",
  ]);

  function buildProfileHtml(type, p, m) {
    type = normalizeType(type); // ensure consistent type even if passed raw AI value
    const shown = new Set();
    let html = "";

    // ── row renderer ──
    const row = (label, value) => {
      if (value === undefined || value === null || value === "") return "";
      shown.add(label);
      let val;
      if (Array.isArray(value)) {
        val = value.length
          ? `<div class="tag-list">${value.map(v => `<span class="tag">${v}</span>`).join("")}</div>`
          : `<span class="field-value muted">—</span>`;
      } else if (typeof value === "boolean") {
        val = `<span class="${value ? "bool-yes" : "bool-no"}">${value ? "Yes" : "No"}</span>`;
      } else if (typeof value === "string" && /^https?:\/\/|^[\w-]+\.\w{2,}/.test(value)) {
        const href = value.startsWith("http") ? value : "https://" + value;
        val = `<a href="${href}" target="_blank" rel="noopener">${value}</a>`;
      } else {
        val = `${value}`;
      }
      return `<div class="field-row"><div class="field-label">${label}</div><div class="field-value">${val}</div></div>`;
    };

    const section = (title, rows) => {
      const content = rows.filter(Boolean).join("");
      if (!content) return "";
      return `<div class="profile-section"><div class="section-title">${title}</div>${content}</div>`;
    };

    // ── Account ──
    html += section("Account", [
      row("Name", p.name),
      row("Member ID", m.id),
      row("Source", m.source),
      row("Member Type", p.memberType),
      row("Onboarding Complete", p.onboardingComplete),
      m.lastActiveAt ? row("Last Active", new Date(m.lastActiveAt._seconds * 1000).toLocaleString()) : "",
    ]);

    // ── Type-specific profile ──
    if (type === "vendor") {
      html += section("Business", [
        row("Business Link", p.businessLink),
        row("Approved Blurb", p.approvedBlurb),
        row("Description", p.businessDescription),
        row("What They Share", p.shareTypes),
        row("Event Platforms", p.eventPlatforms),
        row("Open to Business Collabs", p.openToBusinessCollabs),
      ]);
    } else if (type === "shopper") {
      html += section("Shopper Profile", [
        row("Neighborhood / Location", p.neighborhood || p.location),
        row("Interests", p.interests),
        row("Stay Connected Preference", p.stayConnectedPreference || p.connectionPreference),
        row("Personal Note (anonymous intro)", p.personalNote),
      ]);
    } else if (type === "artist") {
      html += section("Artist Profile", [
        row("Discipline", p.discipline),
        row("City", p.city),
        row("Travel Radius", p.travelRadius),
        row("Venue Types", p.venueTypes),
        row("Portfolio Link", p.portfolioLink),
        row("Event Platforms", p.eventPlatforms),
        row("Open to Artist Collabs", p.openToArtistCollabs),
      ]);
    } else if (type === "organizer") {
      html += section("Organizer Profile", [
        row("Cause / Community", p.cause),
        row("Impact Goals", p.impactGoals),
        row("Wants to Connect With", p.connectWith),
        row("Organization Link", p.orgLink),
        row("Open to Other Communities", p.openToOtherCommunities),
      ]);
    } else if (type === "influencer") {
      html += section("Influencer Profile", [
        row("Niche", p.niche),
        row("Platforms", p.platforms),
        row("Audience Size", p.audienceSize),
        row("Partnership Types", p.partnershipTypes),
        row("Profile Link", p.profileLink),
      ]);
    }

    // ── Catch-all: any profile keys not yet shown ──
    const extras = Object.entries(p).filter(([k]) => !KNOWN_PROFILE_KEYS.has(k));
    if (extras.length) {
      html += section("Additional Fields", extras.map(([k, v]) => row(k, v)));
    }

    if (!html) {
      html = `<div class="profile-section"><p style="color:#9ca3af;font-size:13px">No profile data collected yet — conversation may still be in progress.</p></div>`;
    }

    // ── Raw JSON (collapsible) ──
    const rawData = { id: m.id, source: m.source, lastActiveAt: m.lastActiveAt, profile: p };
    html += `<div class="raw-toggle"><details>
      <summary>Raw JSON</summary>
      <div class="raw-json">${JSON.stringify(rawData, null, 2)}</div>
    </details></div>`;

    return html;
  }

  function switchTab(name) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    document.querySelector(`.tab-btn[onclick="switchTab('${name}')"]`).classList.add("active");
    document.getElementById(name === "profile" ? "tabProfile" : "tabConversation").classList.add("active");
    if (name === "conversation" && currentModalId) loadConversation();
  }

  async function loadConversation() {
    const panel = document.getElementById("tabConversation");
    panel.innerHTML = `<div class="convo-empty">Loading…</div>`;
    try {
      const token = sessionStorage.getItem("admin_token");
      const res = await fetch(
        `/.netlify/functions/conversation?memberId=${encodeURIComponent(currentModalId)}`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      const { history } = await res.json();
      if (!history?.length) {
        panel.innerHTML = `<div class="convo-empty">No conversation history yet.</div>`;
        return;
      }
      const bubbles = history.map(msg => {
        const isUser = msg.role === "user";
        return `<div class="bubble-row ${isUser ? "user" : "assistant"}">
          <div>
            <div class="bubble-role">${isUser ? "Member" : "Agent"}</div>
            <div class="bubble">${escapeHtml(msg.content)}</div>
          </div>
        </div>`;
      }).join("");
      panel.innerHTML = `<div class="convo-wrap">${bubbles}</div>`;
    } catch {
      panel.innerHTML = `<div class="convo-empty" style="color:#dc2626">Failed to load conversation.</div>`;
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function findMatches() {
    if (!currentModalId) return;
    const btn = document.getElementById("findMatchesBtn");
    const panel = document.getElementById("matchesPanel");
    btn.disabled = true;
    btn.textContent = "Finding…";
    panel.innerHTML = `<p style="padding:8px 0;color:#9ca3af;font-size:13px">Loading matches…</p>`;

    try {
      const token = sessionStorage.getItem("admin_token");
      const res = await fetch(
        `/.netlify/functions/matches?memberId=${encodeURIComponent(currentModalId)}&topK=5`,
        { headers: { Authorization: `Bearer ${token}` } }
      );
      const data = await res.json();

      if (!data.matches?.length) {
        panel.innerHTML = `<p style="padding:8px 0;color:#9ca3af;font-size:13px">No matches yet — member profile may still be building up.</p>`;
        return;
      }

      const cards = data.matches.map(m => {
        const type = getMemberType(m);
        const p = m.profile || {};
        const score = Math.round((m.similarityScore || 0) * 100);
        const summary = p.approvedBlurb || (p.interests?.join(", ")) || p.discipline || p.cause || p.niche || "—";
        const location = p.neighborhood || p.city || p.location || "";
        return `<div class="match-card" onclick="closeModalDirect(); openModal('${escapeId(m.id)}')">
          <div class="match-score">${score}%</div>
          <div class="match-info">
            <div class="match-name"><span class="badge badge-${type}">${type}</span></div>
            <div class="match-summary">${summary}</div>
            ${location ? `<div class="match-location">${location}</div>` : ""}
          </div>
        </div>`;
      }).join("");

      panel.innerHTML = `<div class="profile-section" style="border-top:1px solid #f3f4f6;padding-top:16px;">
        <div class="section-title">Top Matches</div>
        <div class="matches-list">${cards}</div>
      </div>`;
    } catch {
      panel.innerHTML = `<p style="padding:8px 0;color:#dc2626;font-size:13px">Failed to load matches.</p>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Find Matches";
    }
  }

  function closeModal(e) {
    if (e.target === document.getElementById("modalOverlay")) closeModalDirect();
  }
  function closeModalDirect() {
    document.getElementById("modalOverlay").classList.remove("open");
  }

  // ── Helpers ──
  function timeAgo(ms) {
    const diff = Date.now() - ms;
    const m = Math.floor(diff / 60000);
    if (m < 1)  return "just now";
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h / 24);
    return `${d}d ago`;
  }

  // ── Convener: complementary collaborator search ──
  async function convenerSearch() {
    const objective = document.getElementById("convenerObjective").value.trim();
    const results = document.getElementById("convenerResults");
    if (!objective) { results.innerHTML = ""; return; }
    results.innerHTML = `<p style="color:#9ca3af;font-size:13px">Searching the community…</p>`;
    const token = sessionStorage.getItem("admin_token");
    try {
      const res = await fetch("/.netlify/functions/convener-search", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({ objective, limit: 12 }),
      });
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      if (!data.candidates?.length) {
        results.innerHTML = `<p style="color:#9ca3af;font-size:13px">No collaborators surfaced yet — the network may still be filling in (run /backfill-structured?reembedAll=1 once after deploy).</p>`;
        return;
      }
      results.innerHTML = data.candidates.map(convenerCard).join("");
    } catch {
      results.innerHTML = `<p style="color:#dc2626;font-size:13px">Search failed.</p>`;
    }
  }

  function convenerCard(c) {
    const type = c.memberType || "unknown";
    const loc = [c.neighborhood, c.city].filter(Boolean).join(", ");
    const offers = (c.offers || []).slice(0, 3).join(", ");
    const fit = (c.fit || []).join(" · ");
    const unclaimed = c.status === "unclaimed"
      ? ` <span style="font-size:10px;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:6px;">unclaimed</span>` : "";
    return `<div class="match-card" style="cursor:default;">
      <div class="match-score">${Math.round((c.score || 0) * 100)}</div>
      <div class="match-info" style="flex:1;">
        <div class="match-name"><span class="badge badge-${type}">${type}</span> <strong>${escapeHtml(c.name || c.id)}</strong>${unclaimed}</div>
        ${offers ? `<div class="match-summary">offers: ${escapeHtml(offers)}</div>` : ""}
        ${c.description ? `<div class="match-summary">${escapeHtml(c.description)}</div>` : ""}
        ${loc ? `<div class="match-location">${escapeHtml(loc)}</div>` : ""}
        ${fit ? `<div style="font-size:11px;color:#059669;margin-top:2px;">${escapeHtml(fit)}</div>` : ""}
      </div>
      <button class="refresh-btn" onclick="logConvenerIntro('${escapeId(c.id)}', this)">Log intro</button>
    </div>`;
  }

  async function logConvenerIntro(candidateId, btn) {
    const anchor = document.getElementById("convenerAnchor").value.trim();
    const objective = document.getElementById("convenerObjective").value.trim();
    if (!anchor) {
      alert("Set an Anchor member ID first — the member you're connecting this collaborator to (e.g. the event host). The intro is logged from the anchor to this collaborator.");
      return;
    }
    btn.disabled = true;
    btn.textContent = "Logging…";
    const token = sessionStorage.getItem("admin_token");
    try {
      const res = await fetch("/.netlify/functions/match-log", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
        body: JSON.stringify({
          memberId: anchor,
          matchedMemberId: candidateId,
          reason: `convener: ${objective}`.slice(0, 300),
          channel: "web",
        }),
      });
      const data = await res.json();
      btn.textContent = data.ok ? "✓ Logged" : "Failed";
      if (!data.ok) btn.disabled = false;
    } catch {
      btn.textContent = "Failed";
      btn.disabled = false;
    }
  }

  // ── Boot ──
  init();
</script>
</body>
</html>
