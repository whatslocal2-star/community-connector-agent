<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Connector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 700px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #2d6a4f 0%, #40916c 100%);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-avatar {
      width: 42px;
      height: 42px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .header-info h2 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px;
      background: #74c69d;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent { align-self: flex-start; }

    .msg-avatar {
      width: 28px; height: 28px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.agent .bubble {
      background: #f3f4f6;
      color: #111827;
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: #2d6a4f;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 10px;
      color: #9ca3af;
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
    }
    .dot {
      width: 7px; height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fff;
    }
    .input-wrap {
      flex: 1;
      background: #f3f4f6;
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
    }
    textarea {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      resize: none;
      font-size: 14px;
      font-family: inherit;
      color: #111827;
      max-height: 120px;
      line-height: 1.4;
    }
    textarea::placeholder { color: #9ca3af; }

    .send-btn {
      width: 42px; height: 42px;
      background: #2d6a4f;
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .send-btn:hover { background: #1b4332; }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { background: #d1d5db; cursor: not-allowed; transform: none; }

    .send-icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Welcome banner */
    .welcome {
      text-align: center;
      padding: 8px 12px 4px;
      color: #6b7280;
      font-size: 12px;
    }
    .welcome span {
      background: #f3f4f6;
      padding: 4px 12px;
      border-radius: 12px;
    }

    @media (max-height: 700px) {
      .chat-wrapper { border-radius: 0; max-height: 100vh; }
    }
  </style>
</head>
<body>
<div class="chat-wrapper">
  <div class="header">
    <div class="header-avatar">🌿</div>
    <div class="header-info">
      <h2>Community Connector</h2>
      <p><span class="status-dot"></span>Vendors · Shoppers · Artists</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome"><span>Say hi to get started 👋</span></div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea
        id="input"
        rows="1"
        placeholder="Type a message..."
        autocomplete="off"
        spellcheck="true"
      ></textarea>
    </div>
    <button class="send-btn" id="sendBtn" aria-label="Send">
      <svg class="send-icon" viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  // conversation history sent to the API
  let history = [];

  function now() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function addMessage(role, text) {
    const isUser = role === "user";
    const wrapper = document.createElement("div");
    wrapper.className = `msg ${role}`;

    if (!isUser) {
      const avatar = document.createElement("div");
      avatar.className = "msg-avatar";
      avatar.textContent = "🌿";
      wrapper.appendChild(avatar);
    }

    const inner = document.createElement("div");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    inner.appendChild(bubble);

    const time = document.createElement("div");
    time.className = "msg-time";
    time.textContent = now();
    inner.appendChild(time);

    wrapper.appendChild(inner);
    messagesEl.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
  }

  function showTyping() {
    const wrapper = document.createElement("div");
    wrapper.className = "msg agent typing";
    wrapper.id = "typing";

    const avatar = document.createElement("div");
    avatar.className = "msg-avatar";
    avatar.textContent = "🌿";
    wrapper.appendChild(avatar);

    const inner = document.createElement("div");
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      bubble.appendChild(dot);
    }
    inner.appendChild(bubble);
    wrapper.appendChild(inner);

    messagesEl.appendChild(wrapper);
    scrollToBottom();
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: "smooth" });
  }

  function setLoading(loading) {
    sendBtn.disabled = loading;
    inputEl.disabled = loading;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;

    // Remove welcome banner on first message
    const welcome = messagesEl.querySelector(".welcome");
    if (welcome) welcome.remove();

    inputEl.value = "";
    inputEl.style.height = "auto";

    addMessage("user", text);
    history.push({ role: "user", content: text });

    setLoading(true);
    showTyping();

    try {
      const res = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok || data.error) {
        addMessage("agent", data.error || "Something went wrong. Please try again.");
        return;
      }

      addMessage("agent", data.reply);
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      removeTyping();
      addMessage("agent", "Connection error. Please check your network and try again.");
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", send);

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });
</script>
</body>
</html>
